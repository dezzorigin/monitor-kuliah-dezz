name: CI

# CI untuk monitor-kuliah-dezz (repo P1 #47 — automation monitor kuliah
# Python + landing statis buku log / arsip absensi).
# Job:
#   python-test    — py_compile semua .py + pytest tests/ (26 tes: jadwal,
#                    jendela absen, parser absensi, mode demo, sanitasi PDF).
#                    Tanpa jaringan, tanpa kredensial, tanpa login nyata.
#   lint-ruff      — ruff check (E4/E7/E9/F, lihat pyproject.toml).
#   gitleaks       — secret-scan SELURUH riwayat (fetch-depth 0). Repo ini
#                    pegang kredensial vault — job ini WAJIB hijau.
#   advisory-sweep — OSV batch (pola repo #24-#46); dependensi produksi
#                    dipin di requirements.txt (PyPI). HIGH/CRITICAL = gagal.
#                    JANGAN pakai npm audit sebagai gate.
#   static-checks  — gate P0 anti-slop + tag OG/Twitter + data asli repo.
#   playwright-e2e — landing statis di server lokal (desktop + mobile).
#                    HANYA di CI; Chromium lokal tidak bisa start di VM dev.
#   smoke          — file yang di-deploy ada & tidak kosong.
# Repo ini TIDAK punya package-lock.json: CI pakai `npm install`
# (bukan `npm ci`) dan TANPA `cache: npm` di setup-node.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python: compile + pytest (tanpa jaringan/kredensial) ───────────────
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependensi + pytest
        run: pip install -r requirements.txt pytest

      - name: Compile semua modul Python
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Uji jadwal + jendela + parser + demo (26 tes)
        run: python3 -m pytest tests/ -q

      - name: Demo mode absen_run (tanpa login)
        run: python3 scripts/absen_run.py --demo

  # ── Lint: ruff ─────────────────────────────────────────────────────────
  lint-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  # ── Gitleaks: secret-scan seluruh riwayat ──────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan (riwayat penuh)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Advisory sweep (OSV batch, tanpa auth) ─────────────────────────────
  advisory-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep dependensi produksi (PyPI) di OSV
        run: python3 scripts/advisory-sweep.py

  # ── Pemeriksaan statis: gate P0 + tag OG + data asli ──────────────────
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (generator og-image)
        run: pip install pillow

      - name: Regenerasi og-image.png (pastikan skrip jalan)
        run: python3 scripts/make-og-image.py

      - name: Gate P0 + tag OG/Twitter + data asli repo
        run: python3 scripts/check-static.py

  # ── E2E Playwright (landing statis, HANYA di CI) ──────────────────────
  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E landing (desktop + mobile)
        run: npm run e2e

  # ── Smoke: file deploy ada & tidak kosong ──────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File deploy ada & tidak kosong
        run: |
          for f in landing/index.html landing/styles.css landing/app.js landing/favicon.svg landing/og-image.png; do
            test -s "$f" || { echo "FAIL: $f hilang/kosong"; exit 1; }
          done
          test "$(stat -c%s landing/og-image.png)" -ge 10240 || { echo "FAIL: og-image.png < 10KB"; exit 1; }
          echo "OK: semua file deploy ada"
